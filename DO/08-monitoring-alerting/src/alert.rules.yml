groups:
  - name: swarm_infrastructure_alerts
    rules:
      
      - alert: LowMemoryCritical
        expr: node_memory_MemAvailable_bytes{job="node-exporter"} < 104857600
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Критически мало памяти на узле {{ $labels.instance }}"
          description: "Объем свободной оперативной памяти упал ниже 100 МБ. Текущее значение: {{ $value | humanize1024 }}B."

      
      - alert: HighRamUsageWarning
        expr: (node_memory_MemTotal_bytes{job="node-exporter"} - node_memory_MemAvailable_bytes{job="node-exporter"}) > 1073741824
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Высокое потребление памяти на {{ $labels.instance }}"
          description: "Затраченный объем оперативной памяти превысил 1 ГБ."

      
      - alert: SwarmServiceCpuSpike
        expr: sum(rate(container_cpu_usage_seconds_total{container_label_com_docker_swarm_service_name!=""}[5m])) by (container_label_com_docker_swarm_service_name) * 100 > 10
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "Высокая нагрузка на CPU в сервисе {{ $labels.container_label_com_docker_swarm_service_name }}"
          description: "Утилизация процессора данным Swarm-сервисом превысила 10% за последние 5 минут."
