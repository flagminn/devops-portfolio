global:
  scrape_interval: 15s  

rule_files:
  - "/etc/prometheus/alert.rules.yml"

alerting:
  alertmanagers:
    - dns_sd_configs:
        - names: ['tasks.alertmanager']
          type: 'A'
          port: 9093

scrape_configs:
    # 1. Сбор метрик с Gateway (Порт 8087)
  - job_name: 'swarm-gateway'
    metrics_path: '/actuator/prometheus'
    dns_sd_configs:
      - names: ['tasks.gateway']
        type: 'A'
        port: 8087

  # 2. Сбор метрик с Session (Порт 8081)
  - job_name: 'swarm-session'
    metrics_path: '/actuator/prometheus'
    dns_sd_configs:
      - names: ['tasks.session']
        type: 'A'
        port: 8081

  # 3. Сбор метрик с Booking (Порт 8083)
  - job_name: 'swarm-booking'
    metrics_path: '/actuator/prometheus'
    dns_sd_configs:
      - names: ['tasks.booking']
        type: 'A'
        port: 8083

  # 4. Сбор метрик с Report (Порт 8086)
  - job_name: 'swarm-report'
    metrics_path: '/actuator/prometheus'
    dns_sd_configs:
      - names: ['tasks.report']
        type: 'A'
        port: 8086


 
  - job_name: 'node-exporter'
    dns_sd_configs:
      - names: ['tasks.node_exporter'] 
        type: 'A'
        port: 9100 

  
  - job_name: 'cadvisor'
    dns_sd_configs:
      - names: ['tasks.cadvisor'] 
        type: 'A'
        port: 8080 

 
  - job_name: 'blackbox-google'
    metrics_path: /probe
    params:
      module: [http_2xx]  
    static_configs:
      - targets:
        - https://google.com
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox_exporter:9115 